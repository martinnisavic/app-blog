<nav>
  <a routerLink="/">Blog</a>
  <div class="right">
    <a routerLink="/">Home</a>
    @if (authService.isLoggedIn()) {
      <a routerLink="/createPost">New post</a>
      @if (authService.isAdmin()) {
        <a routerLink="/users">Users</a>
      }
      <button (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    }
  </div>
</nav>
