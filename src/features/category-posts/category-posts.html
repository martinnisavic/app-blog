<section class="cat-posts">
  <a class="back" routerLink="/categories">← Nazad na kategorije</a>
  <h2>{{ categoryName() }}</h2>

  @if (loading()) {
    <p class="msg">Loading...</p>
  } @else if (posts().length === 0) {
    <p class="msg">Nema postova u ovoj kategoriji.</p>
  } @else {
    <div class="posts">
      @for (p of posts(); track p.id) {
        <article class="post-card">
          @if (p.image) { <img [src]="p.image" [alt]="p.title"> }
          <h3>{{ p.title }}</h3>
          <p class="author">by {{ p.author }}</p>
          <p class="desc">{{ p.description }}</p>
          <a [routerLink]="['/post', p.id]">Read more →</a>
        </article>
      }
    </div>
  }
</section>
